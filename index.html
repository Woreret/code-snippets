<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Modern Snippets</title>
</head>
<body>
    <div class="main-container">
        <div class="glass-card">
            <h1 class="app-title">Create Snippet</h1>
            
            <div class="input-group">
                <label for="title">Title</label>
                <input type="text" id="title" placeholder="e.g. Array Sort">
            </div>

            <div class="input-group">
                <label for="language">Language</label>
                <input type="text" id="language" placeholder="e.g. JavaScript">
            </div>

            <div class="input-group">
                <label for="code">Code</label>
                <textarea id="code" cols="30" rows="10" placeholder="Paste your code here..."></textarea>
            </div>

            <button class="submit-btn">Save Snippet</button>
        </div>

        <div class="glass-card" id="snippet-list">
            <!-- Output space for recording -->
        </div>
    </div>
</body>
<script src="index.js"></script>
</html>
